name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear estructura del proyecto (solo la primera vez)
        run: |
          if [ -f .netcorte-ok ]; then echo 'Proyecto ya creado, se omite'; exit 0; fi
          rm -rf app
          mkdir -p app app/src/main app/src/main/java/com/netcorte/app app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values
          cat > settings.gradle.kts <<'NETCORTE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NetCorte"
          include(":app")
          NETCORTE_EOF
          cat > build.gradle.kts <<'NETCORTE_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          NETCORTE_EOF
          cat > gradle.properties <<'NETCORTE_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          org.gradle.caching=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          NETCORTE_EOF
          cat > .gitignore <<'NETCORTE_EOF'
          *.iml
          .gradle/
          build/
          local.properties
          .idea/
          .DS_Store
          *.apk
          NETCORTE_EOF
          cat > README.md <<'NETCORTE_EOF'
          # NetCorte

          App Android (Kotlin) con botón flotante que corta todo el tráfico de internet (VPN local "agujero negro") y lo restaura al instante.

          ## Compilar el APK en GitHub
          1. Crea un repositorio y sube TODO el contenido de esta carpeta (incluida `.github`).
          2. Ve a la pestaña **Actions** → "Build APK" (corre solo en cada push, o pulsa *Run workflow*).
          3. Al terminar, abre la ejecución y descarga **NetCorte-apk** (contiene `app-release.apk`).
          4. Instálalo en el teléfono (permite instalar apps de origen desconocido).

          ## Primer uso
          1. Abre la app → **Permitir mostrar sobre otras apps**.
          2. **Autorizar conexión VPN**.
          3. **Mostrar botón flotante** → toca el círculo para cortar / restaurar. Arrástralo para moverlo.
          NETCORTE_EOF
          cat > app/build.gradle.kts <<'NETCORTE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.netcorte.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.netcorte.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      // Optimizado y pequeño, firmado con la clave debug para que sea instalable.
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
